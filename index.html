<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة توزيع السكاكر الفاخرة</title>
    <!-- المكتبات المطلوبة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خلفية Three.js تفاعلية ثلاثية الأبعاد -->
    <div id="canvas-container"></div>

    <!-- الشريط العبوي الفخم -->
    <header class="luxury-header">
        <div class="logo-area">
            <i class="fa-solid fa-candy-cane"></i>
            <h1>عالم السكاكر الفاخرة</h1>
        </div>
        <div>
            <a href="admin.html" class="btn-outline"><i class="fa-solid fa-lock"></i> دخول الأدمن</a>
        </div>
    </header>

    <div class="container">
        <!-- قسم العروض المتحركة Swiper.js -->
        <div style="margin-bottom: 40px;">
            <h2 style="font-size: 1.3rem; margin-bottom: 15px; color: var(--primary);">أبرز المنتجات المميزة</h2>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="swiperWrapper">
                    <!-- يتم تعبئتها ديناميكياً -->
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </div>

        <!-- قائمة المنتجات الكاملة -->
        <h2 style="font-size: 1.3rem; margin-bottom: 15px;">كتالوج المنتجات المتاحة</h2>
        <div class="products-grid" id="productsGrid">
            <!-- المنتجات المتاحة -->
        </div>
    </div>

    <!-- زر السلة العائم -->
    <div class="cart-floating" onclick="openCartModal()">
        <i class="fa-solid fa-shopping-cart"></i>
        <div class="cart-badge" id="cartCount">0</div>
    </div>

    <!-- نافذة سلة المشتريات وإرسال الفاتورة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>سلة طلبات البضاعة</h2>
                <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.4rem;" onclick="closeModal('cartModal')"></i>
            </div>
            
            <div id="cartItemsList" style="margin-bottom: 20px; max-height: 250px; overflow-y: auto;">
                <!-- عناصر السلة -->
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; color:var(--text-muted)">اختر السوبرماركت (المحلات الدائمة):</label>
                <select id="supermarketSelect" class="form-control" onchange="onSupermarketSelect()">
                    <option value="">-- اختر السوبرماركت --</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; color:var(--text-muted)">رقم هاتف السوبرماركت (واتساب):</label>
                <input type="text" id="targetPhone" class="form-control" placeholder="07xxxxxxxx">
            </div>

            <button class="btn-luxury" style="width: 100%; justify-content: center;" onclick="generatePDFInvoice()">
                <i class="fa-solid fa-file-pdf"></i> إصدار فاتورة PDF وإرسالها
            </button>
        </div>
    </div>

    <!-- مكتبات JavaScript المطلوبة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
