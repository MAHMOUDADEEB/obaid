<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - سكاكر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة تسجيل الدخول (تظهر تلقائياً إذا لم يتم تسجيل الدخول) -->
    <div class="modal active" id="loginModal" style="background: var(--bg-main);">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
            <h2>تسجيل دخول الأدمن</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">أدخل بيانات الاعتماد الخاصة بك</p>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" class="form-control" placeholder="اسم المستخدم (m7md)" required>
                <input type="password" id="password" class="form-control" placeholder="كلمة المرور (2001)" required>
                <button type="submit" class="btn-luxury" style="width: 100%; justify-content: center;">دخول النظام</button>
            </form>
        </div>
    </div>

    <!-- محتوى لوحة التحكم الفاخرة -->
    <div id="adminDashboard" style="display: none;">
        <header class="luxury-header">
            <div class="logo-area">
                <i class="fa-solid fa-gauge-high"></i>
                <h1>لوحة التحكم والجرد اليومي</h1>
            </div>
            <div>
                <a href="index.html" class="btn-outline"><i class="fa-solid fa-store"></i> عرض المتجر</a>
                <button class="btn-outline" onclick="logout()" style="border-color: var(--danger); color: var(--danger);">خروج</button>
            </div>
        </header>

        <div class="container">
            <!-- أزرار الإجراءات الرئيسية -->
            <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
                <button class="btn-luxury" onclick="openAddProductModal()"><i class="fa-solid fa-plus"></i> إضافة بضاعة جديدة</button>
                <button class="btn-luxury" style="background: linear-gradient(135deg, #06b6d4, #0891b2);" onclick="openSupermarketsModal()"><i class="fa-solid fa-shop"></i> إدارة محلات السوبرماركت الدائمة</button>
                <button class="btn-outline" onclick="exportInventoryPDF()"><i class="fa-solid fa-file-pdf"></i> جرد اليوم والأرباح (PDF)</button>
            </div>

            <!-- بطاقات الإحصائيات والأرباح -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div style="background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <p style="color: var(--text-muted); font-size: 0.85rem;">إجمالي الأصناف</p>
                    <h3 id="statTotalProducts" style="font-size: 1.8rem; color: var(--primary);">0</h3>
                </div>
                <div style="background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <p style="color: var(--text-muted); font-size: 0.85rem;">الربح المتوقع للمخزون</p>
                    <h3 id="statTotalProfit" style="font-size: 1.8rem; color: var(--success);">0.00 د.أ</h3>
                </div>
            </div>

            <!-- قائمة إدارة البضاعة وإخفائها -->
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">إدارة وحالة بضاعة السكاكر</h2>
            <div class="products-grid" id="adminProductsGrid"></div>
        </div>
    </div>

    <!-- نافذة إضافة منتج جديد -->
    <div class="modal" id="addProductModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>إضافة منتج سكاكر جديد</h2>
                <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.4rem;" onclick="closeModal('addProductModal')"></i>
            </div>
            <form onsubmit="saveNewProduct(event)">
                <input type="text" id="prodName" class="form-control" placeholder="اسم المنتج" required>
                <input type="text" id="prodImage" class="form-control" placeholder="رابط صورة المنتج (URL)" required>
                <input type="number" step="0.01" id="prodCost" class="form-control" placeholder="سعر التكلفة (عليك)" required>
                <input type="number" step="0.01" id="prodPrice" class="form-control" placeholder="سعر البيع للزبون" required>
                <button type="submit" class="btn-luxury" style="width: 100%; justify-content: center;">حفظ المنتج</button>
            </form>
        </div>
    </div>

    <!-- نافذة إدارة السوبرماركت الثابتة وأرقام الهواتف -->
    <div class="modal" id="supermarketModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>إدارة المحلات الدائمة (أرقام الهواتف)</h2>
                <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.4rem;" onclick="closeModal('supermarketModal')"></i>
            </div>
            <form onsubmit="saveSupermarket(event)" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="smName" class="form-control" placeholder="اسم السوبرماركت" required style="margin-bottom:0;">
                <input type="text" id="smPhone" class="form-control" placeholder="رقم الهاتف" required style="margin-bottom:0;">
                <button type="submit" class="btn-luxury">إضافة</button>
            </form>
            <div id="supermarketsListContainer" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
